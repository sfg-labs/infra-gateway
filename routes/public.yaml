# Public routes — no JWT required.
# Covers: Zitadel auth endpoints, health checks, Razorpay webhooks.
# WARNING: Adding a path here means ANY caller can reach it unauthenticated.
#          Review every addition carefully before merging.
#
# WARNING 2 — A PUBLIC RULE UNDER AN AUTHENTICATED PREFIX ALSO STEALS THE PREFLIGHT.
#          Prefer a dedicated prefix nothing else claims (/api/public/<feature>/*, as
#          `suwalka-assessment-public` and `suwalka-resume-public` below do) — such a
#          rule shadows nothing and needs no extra guard.
#          If a public rule MUST sit inside an authenticated prefix (as
#          `suwalka-gatepass-public` does, because its path is already printed on QR
#          codes in candidates' hands), a restrictive `methods:` list is NOT enough.
#          The public rule still needs OPTIONS for its own browser callers, and a
#          higher `priority` makes it win the OPTIONS match for EVERY deeper path
#          under that prefix — so it answers the preflight for the authenticated
#          siblings with its own narrow `allow_methods`, and every browser then
#          refuses to send the real request. Nothing in the service's own test suite
#          can see this: curl, jest and Bruno do not preflight.
#          Pin the exact path shape with a `match.exprs` Path RegexMatch as well
#          (see `suwalka-gatepass-public`), and verify with an actual
#          `OPTIONS <path> -H 'Access-Control-Request-Method: POST'`.
#
# NOTE: This APISIX ingress controller (ApisixRoute apisix.apache.org/v2) routes only to
# Services in the ApisixRoute's OWN namespace — there is no backends[].serviceNamespace.
# So the public routes are split into one ApisixRoute per backend namespace.
---
# --- sfg-gateway backends (Zitadel) ---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: public-routes-gateway
  namespace: sfg-gateway
  labels:
    sfg-auth: public
  annotations:
    sfg-labs.in/description: "Public routes — Zitadel auth server"
spec:
  ingressClassName: apisix
  http:

  # Zitadel auth server — all traffic, no JWT check (Zitadel handles its own auth)
  - name: zitadel-auth
    match:
      hosts:
      - sfg-labs.faithandgamble.in
      paths:
      - /*
    backends:
    - serviceName: sfg-zitadel
      servicePort: 8080
      weight: 100
    plugins:
    - name: request-id
      enable: true
      config:
        header_name: X-Request-Id
        include_in_response: true
    - name: limit-req
      enable: true
      config:
        # Zitadel serves a SPA (console) — one page load fetches many JS chunks/assets at once,
        # so this must be generous or the browser gets 429s and the console shows a white screen.
        rate: 200
        burst: 200
        rejected_code: 429
        key_type: var
        key: remote_addr

  # Zitadel login v2 — served by the separate sfg-zitadel-login service (port 3000), NOT :8080.
  # Higher priority so /ui/v2/login/* wins over the zitadel-auth /* catch-all above.
  - name: zitadel-login-v2
    priority: 10
    match:
      hosts:
      - sfg-labs.faithandgamble.in
      paths:
      - /ui/v2/login
      - /ui/v2/login/*
    backends:
    - serviceName: sfg-zitadel-login
      servicePort: 3000
      weight: 100
    plugins:
    - name: request-id
      enable: true
      config:
        header_name: X-Request-Id
        include_in_response: true
    - name: limit-req
      enable: true
      config:
        rate: 200
        burst: 200
        rejected_code: 429
        key_type: var
        key: remote_addr
---
# --- sfg-apps backends (NMA / Baithak / CMS) ---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: public-routes-apps
  namespace: sfg-apps
  labels:
    sfg-auth: public
  annotations:
    sfg-labs.in/description: "Public routes — NMA/Baithak/CMS health + webhooks"
spec:
  ingressClassName: apisix
  http:

  # NMA health check — explicit paths only, no wildcard
  - name: nma-health
    match:
      hosts:
      - api.nma-india.in
      paths:
      - /health
      - /health/live
      - /health/ready
      methods:
      - GET
    backends:
    - serviceName: nma-india-engine
      servicePort: 3000
      weight: 100

  # Baithak health check — explicit paths only
  - name: baithak-health
    match:
      hosts:
      - api.baithak.live
      paths:
      - /health
      - /health/live
      - /health/ready
      methods:
      - GET
    backends:
    - serviceName: baithak-api
      servicePort: 8000
      weight: 100

  # Razorpay webhook — own route, strict rate limit, POST only.
  # IMPORTANT: Baithak service MUST validate X-Razorpay-Signature on every request.
  # Signature = HMAC-SHA256(webhook_secret, raw_request_body).
  # Razorpay IPs change; do not rely on IP allowlisting alone.
  - name: baithak-razorpay-webhook
    match:
      hosts:
      - api.baithak.live
      paths:
      - /webhooks/razorpay
      methods:
      - POST
    backends:
    - serviceName: baithak-api
      servicePort: 8000
      weight: 100
    plugins:
    - name: limit-req
      enable: true
      config:
        rate: 5
        burst: 2
        rejected_code: 429
        key_type: var
        key: remote_addr
    - name: request-id
      enable: true
      config:
        header_name: X-Request-Id
        include_in_response: true

  # CMS health check — explicit paths only
  - name: cms-health
    match:
      hosts:
      - api.cms.sfg-labs.in
      paths:
      - /health
      - /health/live
      - /health/ready
      methods:
      - GET
    backends:
    - serviceName: cms-api
      servicePort: 8001
      weight: 100
---
# --- sfg-labs backends (Suwalka) ---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: public-routes-suwalka
  namespace: sfg-labs
  labels:
    sfg-auth: public
  annotations:
    sfg-labs.in/description: "Public routes — Suwalka health"
spec:
  ingressClassName: apisix
  http:

  # Suwalka HR/Payroll health check — /healthz (service uses /healthz, not /health)
  - name: suwalka-hr-health
    match:
      hosts:
      - api.suwalka-pos.sfg-labs.in
      paths:
      - /healthz
      methods:
      - GET
    backends:
    - serviceName: suwalka-org-hr-payroll
      servicePort: 3001
      weight: 100

  # Suwalka candidate assessment — PUBLIC BY DESIGN. A job applicant sits a timed
  # recruitment test from an emailed link; they have no Zitadel session and never
  # will, so `openid-connect` is deliberately omitted. The opaque token in the URL
  # IS the credential: 32 random bytes, base64url, and only its sha256 hash is
  # stored server-side, so a leaked database backup yields no working links.
  #
  # Scoped to /api/public/assessment/* rather than /api/public/* on purpose — this
  # file's warning is real, and a wildcard here would silently expose any future
  # /api/public/<anything> the service adds.
  #
  # Methods are GET/POST only: the API reads the paper, starts the clock, saves an
  # answer, and submits. Nothing here updates or deletes.
  #
  # Rate limit deviates from the 20/10 "public webhook" default: same 20 req/s, but
  # burst 20 rather than 10. A candidate's first page load pulls the whole 34-question
  # paper at once, and candidates commonly sit the test from a shared office or mobile
  # -carrier NAT, so several legitimate users can share a remote_addr. 20/s still bounds
  # abuse hard while never troubling a real applicant mid-test. This is also the
  # rate-limiting layer the assessment design deliberately deferred to the gateway.
  - name: suwalka-assessment-public
    match:
      hosts:
      - api.suwalka-pos.sfg-labs.in
      - api.faithandgamble.in
      paths:
      - /api/public/assessment/*
      methods:
      - GET
      - POST
      - OPTIONS
    backends:
    - serviceName: suwalka-org-hr-payroll
      servicePort: 3001
      weight: 100
    plugins:
    # The candidate page is served by admin-web on a different origin to this API,
    # so the browser preflights every POST (answer/submit). Without cors the
    # preflight fails and the candidate cannot save a single answer.
    - name: cors
      enable: true
      config:
        allow_origins: "http://localhost:3000,https://suwalka.faithandgamble.in,https://suwalka-dev.faithandgamble.in"
        allow_methods: "GET,POST,OPTIONS"
        allow_headers: "*"
        allow_credential: false
        max_age: 3600
    - name: limit-req
      enable: true
      config:
        rate: 20
        burst: 20
        rejected_code: 429
        key_type: var
        key: remote_addr
    - name: request-id
      enable: true
      config:
        header_name: X-Request-Id
        include_in_response: true

  # Suwalka interview check-in gatepass — PUBLIC BY DESIGN, and GET-ONLY ON PURPOSE.
  #
  # A candidate invited to an in-person interview is issued a QR gatepass. At the
  # gate they scan it with a phone camera, which opens this URL directly — they have
  # no Zitadel session and never will, exactly like the assessment candidate above.
  # The opaque token in the URL IS the credential; the app returns a display-only
  # `public_gatepass_view` carrying no internal ids, and 410 Gone once the pass is
  # revoked, expired, or past its `max_scans`.
  #
  # ⚠️ THE METHOD LIST IS A SECURITY BOUNDARY, NOT A FORMALITY.
  # This path prefix is shared with TWO AUTHENTICATED endpoints:
  #     GET  /api/recruitment/gatepass/{token}        <- the candidate self-scan (public)
  #     POST /api/recruitment/gatepass/{id}/send      <- recruiter-only (MUST stay private)
  #     POST /api/recruitment/gatepass/{id}/revoke    <- recruiter-only (MUST stay private)
  # Restricting this rule to GET/OPTIONS is what keeps those two private: a POST does
  # not match here, so it falls through to the JWT-protected /api/recruitment/* rule
  # in routes/suwalka-org-hr-payroll.yaml. **Adding POST here would let any caller on
  # the internet re-send or revoke another candidate's gatepass.** The two sibling
  # writes — issue and list — live under /api/recruitment/interviews/* and are
  # unaffected by this prefix at all.
  #
  # ⚠️ THE `exprs` PATH REGEX IS THE OTHER HALF OF THAT BOUNDARY (added 2026-07-28).
  # The method list keeps the real POST private, but it does NOT keep the POST's CORS
  # PREFLIGHT away from this rule — OPTIONS is in the list, and it has to be, because
  # admin-web's public gatepass page fetches the scan URL cross-origin. So before this
  # regex, `OPTIONS /api/recruitment/gatepass/{id}/send` matched HERE (priority 10 beats
  # the authenticated rule's unset 0) and was answered by THIS rule's cors plugin with
  # `access-control-allow-methods: GET,OPTIONS`. Every browser then refused to send the
  # POST at all. Measured live 2026-07-28:
  #
  #   OPTIONS /api/recruitment/gatepass/<id>/send   ACRM: POST
  #     -> 200, access-control-allow-methods: GET,OPTIONS            (browser BLOCKS)
  #   OPTIONS /api/recruitment/gatepass/<id>/revoke ACRM: POST
  #     -> 200, access-control-allow-methods: GET,OPTIONS            (browser BLOCKS)
  #   OPTIONS /api/recruitment/interviews/<id>/resend-invite  (control, same service)
  #     -> 200, access-control-allow-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  #
  # Both "Send QR gatepass" and "Revoke" were therefore dead in every browser while
  # curl, jest and Bruno all passed — none of them preflight. Same failure family as
  # the eleven-day 401 on the self-scan and the interviewer resume link: a gateway-layer
  # break the application's own test suite structurally cannot see.
  #
  # The regex restores the boundary by making this rule match ONLY the single trailing
  # segment it was ever meant to own — the token — and nothing deeper. `/{id}/send` and
  # `/{id}/revoke` no longer match here AT ALL, for any method including OPTIONS, so
  # their preflight falls through to the authenticated /api/recruitment/* rule and is
  # answered with that rule's full method list. `scope: Path` maps to APISIX's `uri`
  # variable and `RegexMatch` to the `~~` operator (apisix-ingress-controller v2.1.0,
  # api/v2/apisixroute_types.go ToVars), i.e. `["uri","~~","^/api/recruitment/gatepass/[^/]+/?$"]`.
  # The token is `SGP1.<b64url payload>.<b64url sig>` — dots and base64url only, never a
  # slash — so `[^/]+` matches every real token. The optional trailing slash is tolerated
  # because express's non-strict router accepts one; it still excludes any deeper segment.
  #
  # WHY NARROW RATHER THAN MOVE THE PATH. The obvious alternative was to relocate the
  # self-scan to /api/public/gatepass/*, matching its two siblings above. Rejected: QR
  # codes and gatepass links carrying /api/recruitment/gatepass/<token> are ALREADY IN
  # CANDIDATES' HANDS with a live validity window, so the old path must keep working —
  # which means keeping this rule — which means the shadowing has to be fixed HERE
  # anyway. Moving would add an org-hr change, an admin-web change and a dual-path
  # compatibility window on top of a fix that this regex completes on its own. Narrowing
  # is strictly additive to security, breaks no issued pass, and needs no other repo.
  #
  # THE RULE THIS ESTABLISHES: a public rule under an authenticated prefix must pin the
  # exact shape of the path it owns, not just its methods. A method list alone leaks the
  # preflight, and a leaked preflight is invisible to every non-browser test.
  #
  # Scoped to /api/recruitment/gatepass/* rather than a wider prefix for the same
  # reason the assessment rule is scoped: this file's warning is real.
  #
  # No `cors` plugin, deliberately. A QR scan is a top-level browser navigation from
  # a phone camera, not a cross-origin XHR, so nothing preflights. If a rendered
  # gatepass page is ever added to admin-web, add cors then — with the origins it
  # actually needs — rather than carrying speculative config now.
  #
  # Rate limit is the file's standard 20/10 public default. Unlike the assessment
  # rule this needs no raised burst: a scan is a single GET, not a 34-question paper
  # pulled in one page load. 20/s still absorbs a queue of candidates arriving
  # together on one reception NAT while bounding token-guessing hard — though the
  # token's own entropy is the real defence, not this.
  - name: suwalka-gatepass-public
    # Explicit priority, unlike the assessment rule above. That one owns a prefix
    # (/api/public/*) nothing else claims, so ordering is moot. This one sits INSIDE
    # the JWT-protected /api/recruitment/* rule, so two rules match the same URL and
    # whichever APISIX evaluates first decides whether the candidate is let in. It
    # currently works without this — but relying on radixtree insertion order means a
    # controller restart could silently put the 401 back. Pin it.
    priority: 10
    match:
      hosts:
      - api.suwalka-pos.sfg-labs.in
      - api.faithandgamble.in
      paths:
      - /api/recruitment/gatepass/*
      methods:
      - GET
      - OPTIONS
      # Owns the token segment and nothing deeper. See the `exprs` note above: this is
      # what stops this rule answering the CORS preflight for the authenticated
      # /{id}/send and /{id}/revoke POSTs with its own restrictive GET,OPTIONS.
      exprs:
      - subject:
          scope: Path
        op: RegexMatch
        value: "^/api/recruitment/gatepass/[^/]+/?$"
    backends:
    - serviceName: suwalka-org-hr-payroll
      servicePort: 3001
      weight: 100
    plugins:
    # The public gatepass page is served by admin-web on a different origin to this
    # API and reads the response with a raw cross-origin fetch, so without ACAO the
    # browser blocks the read even though the request itself now succeeds. My first
    # pass omitted this on the reasoning that a QR scan is a top-level navigation —
    # true of the API URL, but the QR actually points at admin-web's /gatepass/[token]
    # page, which then calls this API. QA caught it: the page renders "Invalid pass."
    # for a blocked read exactly as it does for a genuinely bad token, so the failure
    # is invisible. Same origin list as the assessment rule.
    - name: cors
      enable: true
      config:
        allow_origins: "http://localhost:3000,https://suwalka.faithandgamble.in,https://suwalka-dev.faithandgamble.in"
        allow_methods: "GET,OPTIONS"
        allow_headers: "*"
        allow_credential: false
        max_age: 3600
    - name: limit-req
      enable: true
      config:
        rate: 20
        burst: 10
        rejected_code: 429
        key_type: var
        key: remote_addr
    - name: request-id
      enable: true
      config:
        header_name: X-Request-Id
        include_in_response: true

  # Suwalka interview resume link — PUBLIC BY DESIGN, and GET-ONLY.
  #
  # An interviewer is emailed a panel invite carrying a `Resume:` link to the
  # candidate's CV. They click it out of their mailbox, which sends no Authorization
  # header and no X-Userinfo — exactly like the assessment candidate and the gatepass
  # scan above — so `openid-connect` is deliberately omitted. The opaque token in the
  # URL IS the credential: 32 random bytes, base64url, only its sha256 stored, scoped
  # to ONE interview, expiring (slot_end + 24h, clamped to 30 days) and revoked when
  # the interview is cancelled.
  #
  # ⚠️ WITHOUT THIS BLOCK THE FEATURE DOES NOT WORK, AND NOTHING IN org-hr CAN TELL.
  # The link it replaces was `/api/recruitment/candidates/{id}/resume`, which is under
  # the `bearer_only: true` openid-connect rule in routes/suwalka-org-hr-payroll.yaml —
  # so every interviewer's click was 401'd here, before org-hr was ever reached, while
  # every test in that repo passed. That is precisely how the candidate gatepass
  # self-scan stayed broken for ELEVEN DAYS (see the 2026-07-17 → 2026-07-28 history on
  # `suwalka-gatepass-public` above). A new public path in that service is two PRs, and
  # this is the other one.
  #
  # Scoped to /api/public/interview-resume/* rather than /api/public/* on purpose —
  # this file's warning at the top is real, and a wildcard would silently expose any
  # future /api/public/<anything> org-hr adds. It is a sibling of, not a replacement
  # for, the /api/public/assessment/* rule.
  #
  # GET/OPTIONS only. The endpoint is a pure read and there is no write anywhere under
  # this prefix today — but keeping the method list minimal is what stops a future
  # POST/DELETE added under the same prefix from being unauthenticated by inheritance,
  # which is the mistake the gatepass rule's method list exists to prevent.
  #
  # cors is included because a click on a mailbox link is a top-level navigation that
  # does not preflight — but the response is served `Content-Disposition: attachment`
  # with `Cache-Control: no-store`, and admin-web may later want to render an
  # interviewer-facing page that fetches this cross-origin (the gatepass rule shipped
  # WITHOUT cors on exactly the "it's a top-level navigation" reasoning and QA caught
  # the resulting silent failure: the page rendered its generic error for a blocked
  # read, indistinguishable from a genuinely bad token). Same origin list as the two
  # rules above.
  #
  # Explicit priority, for the same reason the gatepass rule pins one: no other rule
  # in this repo currently claims /api/public/interview-resume/*, so ordering is moot
  # TODAY — and relying on radixtree insertion order to stay moot is how a controller
  # restart silently puts a 401 back. It costs nothing to pin it.
  #
  # Rate limit is the file's standard 20/10 public default, and it is the ONLY rate
  # limiting this endpoint has: org-hr has no in-process limiter and the feature
  # deliberately did not invent one. 20/s absorbs a panel opening the same CV at once
  # from one office NAT while bounding token-guessing; the token's 256 bits of entropy
  # is the real defence, not this.
  - name: suwalka-resume-public
    priority: 10
    match:
      hosts:
      - api.suwalka-pos.sfg-labs.in
      - api.faithandgamble.in
      paths:
      - /api/public/interview-resume/*
      methods:
      - GET
      - OPTIONS
    backends:
    - serviceName: suwalka-org-hr-payroll
      servicePort: 3001
      weight: 100
    plugins:
    - name: cors
      enable: true
      config:
        allow_origins: "http://localhost:3000,https://suwalka.faithandgamble.in,https://suwalka-dev.faithandgamble.in"
        allow_methods: "GET,OPTIONS"
        allow_headers: "*"
        allow_credential: false
        max_age: 3600
    - name: limit-req
      enable: true
      config:
        rate: 20
        burst: 10
        rejected_code: 429
        key_type: var
        key: remote_addr
    - name: request-id
      enable: true
      config:
        header_name: X-Request-Id
        include_in_response: true

  # Suwalka gate scanner devices — PUBLIC AT THE GATEWAY, guarded by a shared secret.
  #
  # GET /api/gate/sync and POST /api/gate/scans are the physical check-in scanners at
  # a dealership gate. They are mounted BEFORE `readUser` in the app precisely because
  # a scanner has no OIDC identity and never will; the app enforces the `X-Gate-Token`
  # shared secret itself (`middleware/gateToken.ts`), mirroring the `X-Internal-Token`
  # pattern used by /api/hr/internal/*.
  #
  # This was anticipated and then missed: `X-Gate-Token` is already in the CORS
  # allow-list on routes/suwalka-org-hr-payroll.yaml:103, but no route ever exposed
  # the path — so scanners could not reach the API at all and the scan ledger in the
  # admin UI could never populate. Adding it was an explicit decision (Ashish,
  # 2026-07-28), taken knowing the trade below.
  #
  # ⚠️ THE TRADE, STATED PLAINLY. Unlike every other rule in this file, the thing
  # protecting these endpoints is a single shared secret, not a per-request signature
  # or an opaque per-subject token. Two consequences worth writing down:
  #   1. The token is global, while `GET /sync` takes `organisation_id` as a QUERY
  #      PARAM — so a leaked token can sync ANY organisation's outstanding gatepasses,
  #      not just the branch it was issued to. Rotating it invalidates every scanner.
  #   2. There is no IP restriction here. If the outlets ever get static egress IPs,
  #      add an `ip-restriction` plugin — that turns a leaked token into a useless one.
  # Neither is a reason not to ship; both are reasons to keep the secret out of client
  # bundles and to rotate it if a scanner device is ever lost.
  #
  # Methods are GET/POST/OPTIONS: sync reads, scans writes a batch. Nothing deletes.
  #
  # cors is included because admin-web has a gate-verify screen and the header is
  # already allow-listed on the authenticated route; a purely native scanner will
  # simply ignore it.
  #
  # Rate limit is deliberately higher than the 20/10 default: a scanner syncs on a
  # timer and posts scan batches as a queue of candidates arrives, all from ONE
  # reception IP, so several devices at one branch legitimately share a remote_addr.
  - name: suwalka-gate-devices
    match:
      hosts:
      - api.suwalka-pos.sfg-labs.in
      - api.faithandgamble.in
      paths:
      - /api/gate/*
      methods:
      - GET
      - POST
      - OPTIONS
    backends:
    - serviceName: suwalka-org-hr-payroll
      servicePort: 3001
      weight: 100
    plugins:
    - name: cors
      enable: true
      config:
        allow_origins: "http://localhost:3000,https://suwalka.faithandgamble.in,https://suwalka-dev.faithandgamble.in"
        allow_methods: "GET,POST,OPTIONS"
        allow_headers: "*"
        allow_credential: false
        max_age: 3600
    - name: limit-req
      enable: true
      config:
        rate: 40
        burst: 40
        rejected_code: 429
        key_type: var
        key: remote_addr
    - name: request-id
      enable: true
      config:
        header_name: X-Request-Id
        include_in_response: true

  # Suwalka HR/Payroll Swagger UI — public read-only API docs, no auth required.
  # External path is /org/swagger(/*); service actually serves it at /docs, so
  # proxy-rewrite strips the external prefix before forwarding upstream.
  - name: suwalka-hr-docs
    match:
      hosts:
      - api.suwalka-pos.sfg-labs.in
      - api.faithandgamble.in
      paths:
      - /org/swagger
      - /org/swagger/*
      methods:
      - GET
    backends:
    - serviceName: suwalka-org-hr-payroll
      servicePort: 3001
      weight: 100
    plugins:
    - name: proxy-rewrite
      enable: true
      config:
        regex_uri:
        - "^/org/swagger(.*)"
        - "/docs$1"

  # Zimma health/readiness rules were REMOVED here (F6, PR #33 review). K8s
  # liveness/readiness probes hit the pod's ClusterIP directly, never the
  # gateway, so a gateway route for /health or /ready adds no value to the
  # probe path itself. Worse, a bare `/health` on this SHARED host
  # (api.faithandgamble.in) was a land-grab: org-hr and ai-services both use
  # `/healthz`/`/readyz` on their hosts precisely to avoid colliding on the
  # generic name. If a caller genuinely needs to check zimma-api's health
  # through the gateway, use a distinct explicit path (e.g. `/zimma/health`),
  # not `/health`.
  # (N5, PR #33 round-2 review: the original version of this comment also
  # claimed the removed rule "made tests/smoke/smoke-test.sh report the
  # gateway healthy based on one unrelated pod" — that script only probes
  # NMA/Baithak/CMS URLs passed in as args and never touches
  # api.faithandgamble.in at all, so that specific claim was wrong. Dropped;
  # the land-grab rationale above is the real reason.)

  # Zimma meeting-platform webhooks (meeting-ended payloads etc.) — POST only,
  # no JWT (the caller is a bot platform, not a browser). zimma-api MUST verify
  # the HMAC signature over the raw body and dedupe on (source, external_id) —
  # both enforced in-app (webhooks.controller + house rule 6 in zimma-api
  # CLAUDE.md). Strict rate limit, same posture as baithak-razorpay-webhook.
  #
  # PATH PREFIX (2026-07-26): matched under /zimma/api/webhooks/* — see the
  # PATH PREFIX note at the top of routes/zimma-api.yaml for why (shared-host
  # collision avoidance on api.faithandgamble.in, same fix already applied to
  # routes/suwalka-ai-services.yaml's /docs -> /ai-service/docs). proxy-rewrite
  # regex_uri below strips /zimma before proxying, so zimma-api's in-app
  # `app.use("/api/webhooks", webhooksRouter())` mount is unchanged.
  #
  # WILDCARD, DELIBERATELY (F8): CLAUDE.md's "public paths listed explicitly,
  # no wildcard" convention is kept here because the varying path segment is
  # the meeting-platform integrationId, a UUID — it cannot be enumerated into
  # an explicit list the way health paths can. The risk this trades away:
  # zimma-api mounts this whole prefix as `app.use("/api/webhooks",
  # webhooksRouter())` (src/app.ts), so ANY future route added under
  # webhooksRouter() becomes internet-public the moment it merges in
  # zimma-api — with no change to this file and no review signal here at
  # all. New webhook adapters must keep the HMAC + idempotency guarantees
  # above; this gateway rule cannot enforce that for them.
  - name: zimma-webhooks
    match:
      hosts:
      - api.faithandgamble.in
      paths:
      - /zimma/api/webhooks/*
      methods:
      - POST
    backends:
    - serviceName: zimma-api
      servicePort: 3001
      weight: 100
    plugins:
    - name: proxy-rewrite
      enable: true
      config:
        regex_uri:
        - "^/zimma(.*)"
        - "$1"
    - name: limit-req
      enable: true
      config:
        rate: 10
        burst: 5
        rejected_code: 429
        key_type: var
        key: remote_addr
    - name: request-id
      enable: true
      config:
        header_name: X-Request-Id
        include_in_response: true
