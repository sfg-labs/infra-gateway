# Public routes — no JWT required.
# Covers: Zitadel auth endpoints, health checks, Razorpay webhooks.
# WARNING: Adding a path here means ANY caller can reach it unauthenticated.
#          Review every addition carefully before merging.
#
# NOTE: This APISIX ingress controller (ApisixRoute apisix.apache.org/v2) routes only to
# Services in the ApisixRoute's OWN namespace — there is no backends[].serviceNamespace.
# So the public routes are split into one ApisixRoute per backend namespace.
---
# --- sfg-gateway backends (Zitadel) ---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: public-routes-gateway
  namespace: sfg-gateway
  labels:
    sfg-auth: public
  annotations:
    sfg-labs.in/description: "Public routes — Zitadel auth server"
spec:
  ingressClassName: apisix
  http:

  # Zitadel auth server — all traffic, no JWT check (Zitadel handles its own auth)
  - name: zitadel-auth
    match:
      hosts:
      - sfg-labs.faithandgamble.in
      paths:
      - /*
    backends:
    - serviceName: sfg-zitadel
      servicePort: 8080
      weight: 100
    plugins:
    - name: request-id
      enable: true
      config:
        header_name: X-Request-Id
        include_in_response: true
    - name: limit-req
      enable: true
      config:
        # Zitadel serves a SPA (console) — one page load fetches many JS chunks/assets at once,
        # so this must be generous or the browser gets 429s and the console shows a white screen.
        rate: 200
        burst: 200
        rejected_code: 429
        key_type: var
        key: remote_addr

  # Zitadel login v2 — served by the separate sfg-zitadel-login service (port 3000), NOT :8080.
  # Higher priority so /ui/v2/login/* wins over the zitadel-auth /* catch-all above.
  - name: zitadel-login-v2
    priority: 10
    match:
      hosts:
      - sfg-labs.faithandgamble.in
      paths:
      - /ui/v2/login
      - /ui/v2/login/*
    backends:
    - serviceName: sfg-zitadel-login
      servicePort: 3000
      weight: 100
    plugins:
    - name: request-id
      enable: true
      config:
        header_name: X-Request-Id
        include_in_response: true
    - name: limit-req
      enable: true
      config:
        rate: 200
        burst: 200
        rejected_code: 429
        key_type: var
        key: remote_addr
---
# --- sfg-apps backends (NMA / Baithak / CMS) ---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: public-routes-apps
  namespace: sfg-apps
  labels:
    sfg-auth: public
  annotations:
    sfg-labs.in/description: "Public routes — NMA/Baithak/CMS health + webhooks"
spec:
  ingressClassName: apisix
  http:

  # NMA health check — explicit paths only, no wildcard
  - name: nma-health
    match:
      hosts:
      - api.nma-india.in
      paths:
      - /health
      - /health/live
      - /health/ready
      methods:
      - GET
    backends:
    - serviceName: nma-india-engine
      servicePort: 3000
      weight: 100

  # Baithak health check — explicit paths only
  - name: baithak-health
    match:
      hosts:
      - api.baithak.live
      paths:
      - /health
      - /health/live
      - /health/ready
      methods:
      - GET
    backends:
    - serviceName: baithak-api
      servicePort: 8000
      weight: 100

  # Razorpay webhook — own route, strict rate limit, POST only.
  # IMPORTANT: Baithak service MUST validate X-Razorpay-Signature on every request.
  # Signature = HMAC-SHA256(webhook_secret, raw_request_body).
  # Razorpay IPs change; do not rely on IP allowlisting alone.
  - name: baithak-razorpay-webhook
    match:
      hosts:
      - api.baithak.live
      paths:
      - /webhooks/razorpay
      methods:
      - POST
    backends:
    - serviceName: baithak-api
      servicePort: 8000
      weight: 100
    plugins:
    - name: limit-req
      enable: true
      config:
        rate: 5
        burst: 2
        rejected_code: 429
        key_type: var
        key: remote_addr
    - name: request-id
      enable: true
      config:
        header_name: X-Request-Id
        include_in_response: true

  # CMS health check — explicit paths only
  - name: cms-health
    match:
      hosts:
      - api.cms.sfg-labs.in
      paths:
      - /health
      - /health/live
      - /health/ready
      methods:
      - GET
    backends:
    - serviceName: cms-api
      servicePort: 8001
      weight: 100
---
# --- sfg-labs backends (Suwalka) ---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: public-routes-suwalka
  namespace: sfg-labs
  labels:
    sfg-auth: public
  annotations:
    sfg-labs.in/description: "Public routes — Suwalka health"
spec:
  ingressClassName: apisix
  http:

  # Suwalka HR/Payroll health check — /healthz (service uses /healthz, not /health)
  - name: suwalka-hr-health
    match:
      hosts:
      - api.suwalka-pos.sfg-labs.in
      paths:
      - /healthz
      methods:
      - GET
    backends:
    - serviceName: suwalka-org-hr-payroll
      servicePort: 3001
      weight: 100

  # Suwalka candidate assessment — PUBLIC BY DESIGN. A job applicant sits a timed
  # recruitment test from an emailed link; they have no Zitadel session and never
  # will, so `openid-connect` is deliberately omitted. The opaque token in the URL
  # IS the credential: 32 random bytes, base64url, and only its sha256 hash is
  # stored server-side, so a leaked database backup yields no working links.
  #
  # Scoped to /api/public/assessment/* rather than /api/public/* on purpose — this
  # file's warning is real, and a wildcard here would silently expose any future
  # /api/public/<anything> the service adds.
  #
  # Methods are GET/POST only: the API reads the paper, starts the clock, saves an
  # answer, and submits. Nothing here updates or deletes.
  #
  # Rate limit deviates from the 20/10 "public webhook" default: same 20 req/s, but
  # burst 20 rather than 10. A candidate's first page load pulls the whole 34-question
  # paper at once, and candidates commonly sit the test from a shared office or mobile
  # -carrier NAT, so several legitimate users can share a remote_addr. 20/s still bounds
  # abuse hard while never troubling a real applicant mid-test. This is also the
  # rate-limiting layer the assessment design deliberately deferred to the gateway.
  - name: suwalka-assessment-public
    match:
      hosts:
      - api.suwalka-pos.sfg-labs.in
      - api.faithandgamble.in
      paths:
      - /api/public/assessment/*
      methods:
      - GET
      - POST
      - OPTIONS
    backends:
    - serviceName: suwalka-org-hr-payroll
      servicePort: 3001
      weight: 100
    plugins:
    # The candidate page is served by admin-web on a different origin to this API,
    # so the browser preflights every POST (answer/submit). Without cors the
    # preflight fails and the candidate cannot save a single answer.
    - name: cors
      enable: true
      config:
        allow_origins: "http://localhost:3000,https://suwalka.faithandgamble.in,https://suwalka-dev.faithandgamble.in"
        allow_methods: "GET,POST,OPTIONS"
        allow_headers: "*"
        allow_credential: false
        max_age: 3600
    - name: limit-req
      enable: true
      config:
        rate: 20
        burst: 20
        rejected_code: 429
        key_type: var
        key: remote_addr
    - name: request-id
      enable: true
      config:
        header_name: X-Request-Id
        include_in_response: true

  # Suwalka interview check-in gatepass — PUBLIC BY DESIGN, and GET-ONLY ON PURPOSE.
  #
  # A candidate invited to an in-person interview is issued a QR gatepass. At the
  # gate they scan it with a phone camera, which opens this URL directly — they have
  # no Zitadel session and never will, exactly like the assessment candidate above.
  # The opaque token in the URL IS the credential; the app returns a display-only
  # `public_gatepass_view` carrying no internal ids, and 410 Gone once the pass is
  # revoked, expired, or past its `max_scans`.
  #
  # ⚠️ THE METHOD LIST IS A SECURITY BOUNDARY, NOT A FORMALITY.
  # This path prefix is shared with an AUTHENTICATED endpoint:
  #     GET  /api/recruitment/gatepass/{token}        <- the candidate self-scan (public)
  #     POST /api/recruitment/gatepass/{id}/revoke    <- recruiter-only (MUST stay private)
  # Restricting this rule to GET/OPTIONS is what keeps `revoke` private: a POST does
  # not match here, so it falls through to the JWT-protected /api/recruitment/* rule
  # in routes/suwalka-org-hr-payroll.yaml. **Adding POST here would let any caller on
  # the internet revoke another candidate's gatepass.** The two sibling writes —
  # issue and list — live under /api/recruitment/interviews/* and are unaffected by
  # this prefix at all.
  #
  # Scoped to /api/recruitment/gatepass/* rather than a wider prefix for the same
  # reason the assessment rule is scoped: this file's warning is real.
  #
  # No `cors` plugin, deliberately. A QR scan is a top-level browser navigation from
  # a phone camera, not a cross-origin XHR, so nothing preflights. If a rendered
  # gatepass page is ever added to admin-web, add cors then — with the origins it
  # actually needs — rather than carrying speculative config now.
  #
  # Rate limit is the file's standard 20/10 public default. Unlike the assessment
  # rule this needs no raised burst: a scan is a single GET, not a 34-question paper
  # pulled in one page load. 20/s still absorbs a queue of candidates arriving
  # together on one reception NAT while bounding token-guessing hard — though the
  # token's own entropy is the real defence, not this.
  - name: suwalka-gatepass-public
    match:
      hosts:
      - api.suwalka-pos.sfg-labs.in
      - api.faithandgamble.in
      paths:
      - /api/recruitment/gatepass/*
      methods:
      - GET
      - OPTIONS
    backends:
    - serviceName: suwalka-org-hr-payroll
      servicePort: 3001
      weight: 100
    plugins:
    - name: limit-req
      enable: true
      config:
        rate: 20
        burst: 10
        rejected_code: 429
        key_type: var
        key: remote_addr
    - name: request-id
      enable: true
      config:
        header_name: X-Request-Id
        include_in_response: true

  # Suwalka HR/Payroll Swagger UI — public read-only API docs, no auth required.
  # External path is /org/swagger(/*); service actually serves it at /docs, so
  # proxy-rewrite strips the external prefix before forwarding upstream.
  - name: suwalka-hr-docs
    match:
      hosts:
      - api.suwalka-pos.sfg-labs.in
      - api.faithandgamble.in
      paths:
      - /org/swagger
      - /org/swagger/*
      methods:
      - GET
    backends:
    - serviceName: suwalka-org-hr-payroll
      servicePort: 3001
      weight: 100
    plugins:
    - name: proxy-rewrite
      enable: true
      config:
        regex_uri:
        - "^/org/swagger(.*)"
        - "/docs$1"

  # Zimma health/readiness rules were REMOVED here (F6, PR #33 review). K8s
  # liveness/readiness probes hit the pod's ClusterIP directly, never the
  # gateway, so a gateway route for /health or /ready adds no value to the
  # probe path itself. Worse, a bare `/health` on this SHARED host
  # (api.faithandgamble.in) was a land-grab: org-hr and ai-services both use
  # `/healthz`/`/readyz` on their hosts precisely to avoid colliding on the
  # generic name. If a caller genuinely needs to check zimma-api's health
  # through the gateway, use a distinct explicit path (e.g. `/zimma/health`),
  # not `/health`.
  # (N5, PR #33 round-2 review: the original version of this comment also
  # claimed the removed rule "made tests/smoke/smoke-test.sh report the
  # gateway healthy based on one unrelated pod" — that script only probes
  # NMA/Baithak/CMS URLs passed in as args and never touches
  # api.faithandgamble.in at all, so that specific claim was wrong. Dropped;
  # the land-grab rationale above is the real reason.)

  # Zimma meeting-platform webhooks (meeting-ended payloads etc.) — POST only,
  # no JWT (the caller is a bot platform, not a browser). zimma-api MUST verify
  # the HMAC signature over the raw body and dedupe on (source, external_id) —
  # both enforced in-app (webhooks.controller + house rule 6 in zimma-api
  # CLAUDE.md). Strict rate limit, same posture as baithak-razorpay-webhook.
  #
  # PATH PREFIX (2026-07-26): matched under /zimma/api/webhooks/* — see the
  # PATH PREFIX note at the top of routes/zimma-api.yaml for why (shared-host
  # collision avoidance on api.faithandgamble.in, same fix already applied to
  # routes/suwalka-ai-services.yaml's /docs -> /ai-service/docs). proxy-rewrite
  # regex_uri below strips /zimma before proxying, so zimma-api's in-app
  # `app.use("/api/webhooks", webhooksRouter())` mount is unchanged.
  #
  # WILDCARD, DELIBERATELY (F8): CLAUDE.md's "public paths listed explicitly,
  # no wildcard" convention is kept here because the varying path segment is
  # the meeting-platform integrationId, a UUID — it cannot be enumerated into
  # an explicit list the way health paths can. The risk this trades away:
  # zimma-api mounts this whole prefix as `app.use("/api/webhooks",
  # webhooksRouter())` (src/app.ts), so ANY future route added under
  # webhooksRouter() becomes internet-public the moment it merges in
  # zimma-api — with no change to this file and no review signal here at
  # all. New webhook adapters must keep the HMAC + idempotency guarantees
  # above; this gateway rule cannot enforce that for them.
  - name: zimma-webhooks
    match:
      hosts:
      - api.faithandgamble.in
      paths:
      - /zimma/api/webhooks/*
      methods:
      - POST
    backends:
    - serviceName: zimma-api
      servicePort: 3001
      weight: 100
    plugins:
    - name: proxy-rewrite
      enable: true
      config:
        regex_uri:
        - "^/zimma(.*)"
        - "$1"
    - name: limit-req
      enable: true
      config:
        rate: 10
        burst: 5
        rejected_code: 429
        key_type: var
        key: remote_addr
    - name: request-id
      enable: true
      config:
        header_name: X-Request-Id
        include_in_response: true
