# UAT mirror of routes/suwalka-org-hr-payroll.yaml — same path set (hr, recruitment,
# perf, docs, helpdesk, grievances incl. collection root, training, unprefixed
# /recruitment/*), same CORS/rate-limit posture, UAT hosts + namespace.
#
# See routes/suwalka-org-hr-payroll.yaml for the rationale behind the CORS values,
# the /api/grievances (no trailing path) special case, and the open questions about
# the "suwalka" realm name and X-Tenant-Id/X-Branch-Id header injection — those
# apply identically here since it's the same Zitadel realm and the same backend
# code path, just against UAT data.
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: suwalka-org-hr-payroll-uat
  namespace: sfg-pos-app-uat
  labels:
    sfg-project: suwalka
    sfg-env: uat
    sfg-auth: jwt
  annotations:
    sfg-labs.in/description: "Suwalka Motors — Org / HR / Payroll service API (UAT)"
    sfg-labs.in/team: "suwalka-team"
    sfg-labs.in/upstream: "suwalka-org-hr-payroll:3001"
spec:
  ingressClassName: apisix
  http:
  - name: suwalka-org-hr-payroll-uat-api
    match:
      hosts:
      - api-uat.suwalka-pos.sfg-labs.in
      - api-uat.faithandgamble.in
      paths:
      - /api/hr/*
      - /api/recruitment/*
      - /api/perf/*
      - /api/docs/*
      - /api/helpdesk/*
      - /api/grievances
      - /api/grievances/*
      - /api/training/*
      - /recruitment/*
      methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    backends:
    - serviceName: suwalka-org-hr-payroll
      servicePort: 3001
      weight: 100
    plugins:
    - name: cors
      enable: true
      config:
        allow_origins: "**"
        allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
        allow_headers: "Authorization,Content-Type,Accept,Idempotency-Key,X-Request-Id,X-Gate-Token,X-Tenant-Id,X-Branch-Id,X-Org-Id"
        allow_credential: true
        max_age: 3600
    - name: openid-connect
      enable: true
      config:
        discovery: https://sfg-labs.faithandgamble.in/.well-known/openid-configuration
        bearer_only: true
        client_id: "bearer-only-unused"
        client_secret: "bearer-only-unused"
        realm: suwalka
        use_jwks: true
        set_userinfo_header: true
        userinfo_header_name: X-Userinfo
        set_id_token_header: false
        set_access_token_header: false
        token_signing_alg_values_expected: RS256
        timeout: 3
    - name: request-id
      enable: true
      config:
        header_name: X-Request-Id
        include_in_response: true
    - name: limit-req
      enable: true
      config:
        rate: 60
        burst: 30
        rejected_code: 429
        key_type: var
        key: remote_addr
    - name: response-rewrite
      enable: true
      config:
        headers:
          set:
            X-Gateway: sfg-labs
            X-Project: suwalka
            X-Env: uat
