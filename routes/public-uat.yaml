# Public routes for the Suwalka UAT namespace (sfg-pos-app-uat) — no JWT required.
# UAT copy of the org-hr-payroll public rules live on the dev cluster (sfg-pos-app
# public-routes-suwalka): careers list/apply, assessment, gatepass, interview-resume and
# gate devices — host api-uat.faithandgamble.in, https://suwalka-uat.faithandgamble.in
# added to CORS. routes/public.yaml on this branch lacks the careers and interview-resume
# rules; the hr-health and hr-docs rules are not carried over to UAT.
# WARNING: Adding a path here means ANY caller can reach it unauthenticated.
#
# These two objects were first applied by hand on 2026-09-17 during UAT (careers page CORS
# block, assessment link 404 "Route Not Found"); this file makes them reproducible.
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: public-routes-suwalka-uat
  namespace: sfg-pos-app-uat
  labels:
    sfg-auth: public
  annotations:
    sfg-labs.in/description: Public routes — UAT careers page (list + apply)
spec:
  http:
  - backends:
    - serviceName: suwalka-org-hr-payroll
      servicePort: 3001
      weight: 100
    match:
      exprs:
      - op: RegexMatch
        subject:
          scope: Path
        value: ^/api/recruitment/public/careers/jobs(/[^/]+(/apply)?)?/?$
      hosts:
      - api-uat.faithandgamble.in
      methods:
      - GET
      - POST
      - OPTIONS
      paths:
      - /api/recruitment/public/careers/*
    name: suwalka-careers-public-uat
    plugins:
    - config:
        allow_credential: false
        allow_headers: '*'
        allow_methods: GET,POST,OPTIONS
        allow_origins: http://localhost:3000,https://suwalka.faithandgamble.in,https://suwalka-dev.faithandgamble.in,https://suwalka-uat.faithandgamble.in
        max_age: 3600
      enable: true
      name: cors
    - config:
        burst: 10
        key: remote_addr
        key_type: var
        rate: 20
        rejected_code: 429
      enable: true
      name: limit-req
    - config:
        headers:
          set:
            X-Client-IP: $remote_addr
      enable: true
      name: proxy-rewrite
    - config:
        header_name: X-Request-Id
        include_in_response: true
      enable: true
      name: request-id
    priority: 10
  - backends:
    - serviceName: suwalka-org-hr-payroll
      servicePort: 3001
      weight: 100
    match:
      exprs:
      - op: RegexMatch
        subject:
          scope: Path
        value: ^/api/recruitment/public/careers/jobs/[^/]+/apply/?$
      hosts:
      - api-uat.faithandgamble.in
      methods:
      - POST
      - OPTIONS
      paths:
      - /api/recruitment/public/careers/jobs/*
    name: suwalka-careers-apply-public-uat
    plugins:
    - config:
        allow_credential: false
        allow_headers: '*'
        allow_methods: POST,OPTIONS
        allow_origins: http://localhost:3000,https://suwalka.faithandgamble.in,https://suwalka-dev.faithandgamble.in,https://suwalka-uat.faithandgamble.in
        max_age: 3600
      enable: true
      name: cors
    - config:
        burst: 2
        key: remote_addr
        key_type: var
        rate: 5
        rejected_code: 429
      enable: true
      name: limit-req
    - config:
        headers:
          set:
            X-Client-IP: $remote_addr
      enable: true
      name: proxy-rewrite
    - config:
        header_name: X-Request-Id
        include_in_response: true
      enable: true
      name: request-id
    priority: 20
  ingressClassName: apisix
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: public-routes-suwalka-uat-extra
  namespace: sfg-pos-app-uat
  labels:
    sfg-auth: public
  annotations:
    sfg-labs.in/description: Public routes — UAT assessment, gatepass, interview-resume, gate devices
spec:
  http:
  - backends:
    - serviceName: suwalka-org-hr-payroll
      servicePort: 3001
      weight: 100
    match:
      hosts:
      - api-uat.faithandgamble.in
      methods:
      - GET
      - POST
      - OPTIONS
      paths:
      - /api/public/assessment/*
    name: suwalka-assessment-public-uat
    plugins:
    - config:
        allow_credential: false
        allow_headers: '*'
        allow_methods: GET,POST,OPTIONS
        allow_origins: http://localhost:3000,https://suwalka.faithandgamble.in,https://suwalka-dev.faithandgamble.in,https://suwalka-uat.faithandgamble.in
        max_age: 3600
      enable: true
      name: cors
    - config:
        burst: 20
        key: remote_addr
        key_type: var
        rate: 20
        rejected_code: 429
      enable: true
      name: limit-req
    - config:
        header_name: X-Request-Id
        include_in_response: true
      enable: true
      name: request-id
  - backends:
    - serviceName: suwalka-org-hr-payroll
      servicePort: 3001
      weight: 100
    match:
      exprs:
      - op: RegexMatch
        subject:
          scope: Path
        value: ^/api/recruitment/gatepass/[^/]+/?$
      hosts:
      - api-uat.faithandgamble.in
      methods:
      - GET
      - OPTIONS
      paths:
      - /api/recruitment/gatepass/*
    name: suwalka-gatepass-public-uat
    plugins:
    - config:
        allow_credential: false
        allow_headers: '*'
        allow_methods: GET,OPTIONS
        allow_origins: http://localhost:3000,https://suwalka.faithandgamble.in,https://suwalka-dev.faithandgamble.in,https://suwalka-uat.faithandgamble.in
        max_age: 3600
      enable: true
      name: cors
    - config:
        burst: 10
        key: remote_addr
        key_type: var
        rate: 20
        rejected_code: 429
      enable: true
      name: limit-req
    - config:
        header_name: X-Request-Id
        include_in_response: true
      enable: true
      name: request-id
    priority: 10
  - backends:
    - serviceName: suwalka-org-hr-payroll
      servicePort: 3001
      weight: 100
    match:
      hosts:
      - api-uat.faithandgamble.in
      methods:
      - GET
      - OPTIONS
      paths:
      - /api/public/interview-resume/*
    name: suwalka-resume-public-uat
    plugins:
    - config:
        allow_credential: false
        allow_headers: '*'
        allow_methods: GET,OPTIONS
        allow_origins: http://localhost:3000,https://suwalka.faithandgamble.in,https://suwalka-dev.faithandgamble.in,https://suwalka-uat.faithandgamble.in
        max_age: 3600
      enable: true
      name: cors
    - config:
        burst: 10
        key: remote_addr
        key_type: var
        rate: 20
        rejected_code: 429
      enable: true
      name: limit-req
    - config:
        header_name: X-Request-Id
        include_in_response: true
      enable: true
      name: request-id
    priority: 10
  # Interviewer scorecard link (2026-09-18) — UAT mirror of `suwalka-scorecard-public`
  # in routes/public.yaml (sfg-labs/infra-gateway#58). org-hr serves
  # /api/public/interview-scorecard/* (GET view + CV, PUT draft, POST submit) before
  # readUser; the token names one panelist. Without this rule every UAT click 404s
  # "Route Not Found" at APISIX — the same dev→UAT copy gap as the resume and
  # assessment rules. Exact methods; cors is load-bearing (the admin-web page sends
  # a cross-origin JSON PUT, which preflights) and must include the UAT origin.
  - backends:
    - serviceName: suwalka-org-hr-payroll
      servicePort: 3001
      weight: 100
    match:
      hosts:
      - api-uat.faithandgamble.in
      methods:
      - GET
      - PUT
      - POST
      - OPTIONS
      paths:
      - /api/public/interview-scorecard/*
    name: suwalka-scorecard-public-uat
    plugins:
    - config:
        allow_credential: false
        allow_headers: Content-Type,X-Request-Id
        allow_methods: GET,PUT,POST,OPTIONS
        allow_origins: http://localhost:3000,https://suwalka.faithandgamble.in,https://suwalka-dev.faithandgamble.in,https://suwalka-uat.faithandgamble.in
        max_age: 3600
      enable: true
      name: cors
    - config:
        burst: 10
        key: remote_addr
        key_type: var
        rate: 20
        rejected_code: 429
      enable: true
      name: limit-req
    - config:
        header_name: X-Request-Id
        include_in_response: true
      enable: true
      name: request-id
    priority: 10
  - backends:
    - serviceName: suwalka-org-hr-payroll
      servicePort: 3001
      weight: 100
    match:
      hosts:
      - api-uat.faithandgamble.in
      methods:
      - GET
      - POST
      - OPTIONS
      paths:
      - /api/gate/*
    name: suwalka-gate-devices-uat
    plugins:
    - config:
        allow_credential: false
        allow_headers: '*'
        allow_methods: GET,POST,OPTIONS
        allow_origins: http://localhost:3000,https://suwalka.faithandgamble.in,https://suwalka-dev.faithandgamble.in,https://suwalka-uat.faithandgamble.in
        max_age: 3600
      enable: true
      name: cors
    - config:
        burst: 40
        key: remote_addr
        key_type: var
        rate: 40
        rejected_code: 429
      enable: true
      name: limit-req
    - config:
        header_name: X-Request-Id
        include_in_response: true
      enable: true
      name: request-id
  ingressClassName: apisix
