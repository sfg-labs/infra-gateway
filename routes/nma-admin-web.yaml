# Public route (no openid-connect) — app does its own auth via NextAuth, same pattern as routes/admin-web.yaml (Suwalka).
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: nma-india-admin-web
  namespace: nma-india
  labels:
    sfg-project: nma-india
    sfg-auth: public
  annotations:
    sfg-labs.in/description: "NMA India — admin web (Next.js frontend)"
    sfg-labs.in/team: "nma-team"
    sfg-labs.in/upstream: "nma-admin-web:3000"
spec:
  ingressClassName: apisix
  http:
  - name: nma-admin-web
    match:
      hosts:
      - app.nomainaudit.com
      paths:
      - /*
      methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
      - HEAD
    backends:
    - serviceName: nma-admin-web
      servicePort: 3000
      weight: 100
    plugins:
    - name: request-id
      enable: true
      config:
        header_name: X-Request-Id
        include_in_response: true
    - name: limit-req
      enable: true
      config:
        rate: 200  # generous — a single page load fetches many JS/CSS chunks at once
        burst: 200
        rejected_code: 429
        key_type: var
        key: remote_addr
    - name: response-rewrite
      enable: true
      config:
        headers:
          set:
            X-Gateway: sfg-labs
            X-Project: nma-india
