    - name: limit-req
      enable: true
      config:
        rate: 80
        burst: 40
        rejected_code: 429
        key_type: var
        key: remote_addr
    - name: response-rewrite
      enable: true
      config:
        headers:
          set:
            X-Gateway: sfg-labs
            X-Project: suwalka-ai-services
            X-Env: uat

  - name: suwalka-ai-services-uat-prefixed-m2m-api-key
    priority: 10
    match:
