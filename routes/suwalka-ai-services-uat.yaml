    plugins:
    - name: proxy-rewrite
      enable: true
      config:
        regex_uri:
        - "^/ai-service(.*)"
        - "$1"
    - name: request-id
      enable: true
      config:
        header_name: X-Request-Id
        include_in_response: true
    - name: limit-req
      enable: true
      config:
        rate: 80
        burst: 40
        rejected_code: 429
        key_type: var
        key: remote_addr
    - name: response-rewrite
      enable: true
      config:
        headers:
          set:
            X-Gateway: sfg-labs
            X-Project: suwalka-ai-services
            X-Env: uat

  - name: suwalka-ai-services-uat-prefixed-api-jwt
    match:
      hosts:
      - api-uat.faithandgamble.in
      paths:
      - /ai-service/v1/*
      methods:
